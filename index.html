<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能查询 · OneToMore</title>
    <link rel="stylesheet" href="https://puhuiti.oss-cn-hangzhou.aliyuncs.com/AlibabaPuHuiTi-3/AlibabaPuHuiTi-3.css">
    <link rel="stylesheet" href="https://sf1-cdn-tos.toutiaostatic.com/obj/eden-cn/jlduhbuvnulog/harmonyos_sans/harmonyos_sans.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @font-face {
            font-family: 'Material Icons Round';
            font-style: normal; font-weight: 400; font-display: block;
            src: url(https://registry.npmmirror.com/material-icons/1.13.12/files/iconfont/material-icons-round.woff2) format('woff2'),
                 url(https://registry.npmmirror.com/material-icons/1.13.12/files/iconfont/material-icons-round.woff) format('woff');
        }
        .material-icons-round {
            font-family: 'Material Icons Round'; font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --ink: #0e0e12;
            --ink-soft: #6b6b80;
            --accent: #5b4fff;
            --accent-glow: rgba(91,79,255,0.25);
            --accent-light: rgba(91,79,255,0.08);
            --surface: #f4f4f8;
            --surface2: #ebebf3;
            --white: #ffffff;
            --danger: #ff4d6d;
            --danger-light: rgba(255,77,109,0.1);
            --success: #00c48c;
            --success-light: rgba(0,196,140,0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245,158,11,0.1);
            --border: rgba(0,0,0,0.07);
            --r-sm: 12px;
            --r-md: 18px;
            --r-lg: 24px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.09);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            min-height: 100%; background: var(--surface);
            font-family: 'Alibaba PuHuiTi 3', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--ink);
        }

        .topbar {
            position: sticky; top: 0; z-index: 200;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .topbar-main {
            height: 56px; display: flex; align-items: center; padding: 0 12px; gap: 8px;
            overflow: hidden;
        }
        .topbar-statusbar {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            font-size: 12px; font-weight: 600; color: var(--ink-soft);
        }
        .topbar-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; flex-shrink: 0; }
        .topbar-logo-icon {
            width: 32px; height: 32px; background: var(--accent);
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
        }
        .topbar-logo-icon .material-icons-round { font-size: 17px !important; color: #fff; }
        .topbar-logo-name { font-family: 'HarmonyOS Sans', sans-serif; font-size: 15px; font-weight: 800; color: var(--ink); }
        .topbar-badge { font-size: 10px; font-weight: 700; background: var(--accent-light); color: var(--accent); padding: 2px 7px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
        .topbar-logo { flex-shrink: 0; }
        .topbar-logo-name { white-space: nowrap; }
        .topbar-sep { flex: 1; }
        .topbar-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600; color: var(--ink-soft);
        }
        .topbar-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #d0d0da; flex-shrink: 0;
        }
        .topbar-dot.online { background: var(--success); animation: dotpulse 1.2s ease-in-out infinite; }

        .layout {
            display: flex; min-height: calc(100vh - 82px);
        }

        .voice-panel {
            width: 420px; flex-shrink: 0;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            position: sticky; top: 82px; height: calc(100vh - 82px);
        }

        .voice-header {
            padding: 20px 20px 0;
        }
        .voice-title {
            font-family: 'HarmonyOS Sans', sans-serif;
            font-size: 18px; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
        }
        .voice-title .material-icons-round { font-size: 20px !important; color: var(--accent); }
        .voice-sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

        .voice-status {
            padding: 16px 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .voice-status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #d0d0da; flex-shrink: 0;
        }
        .voice-status-dot.connected { background: var(--success); animation: dotpulse 1.2s ease-in-out infinite; }
        .voice-status-dot.listening { background: var(--success); animation: dotpulse .6s ease-in-out infinite; }
        .voice-status-dot.speaking { background: var(--accent); animation: dotpulse .6s ease-in-out infinite; }
        .voice-status-text { font-size: 13px; font-weight: 600; color: var(--ink-soft); }

        .voice-subtitle {
            margin: 0 20px;
            padding: 14px 16px;
            background: var(--surface);
            border-radius: var(--r-md);
            font-size: 14px; line-height: 1.65;
            color: var(--ink);
            min-height: 72px;
            word-break: break-all;
            border: 1.5px solid transparent;
            transition: border-color .3s, background .3s;
        }
        .voice-subtitle.listening {
            border-color: rgba(0,196,140,.2);
            background: rgba(0,196,140,.04);
        }
        .voice-subtitle .placeholder { color: #9999aa; font-style: italic; }

        .voice-wave {
            display: flex; align-items: center; justify-content: center;
            gap: 5px; height: 56px; padding: 0 20px;
        }
        .wave-bar {
            width: 4px; height: 28px; border-radius: 3px;
            transform-origin: bottom;
            background: linear-gradient(to top, #5b4fff, #9b59f5);
            transform: scaleY(.2); opacity: .4;
            transition: background .3s;
        }
        .wave-bar.active { animation: wave 1.1s ease-in-out infinite; }
        .wave-bar.active:nth-child(1){animation-delay:0s}
        .wave-bar.active:nth-child(2){animation-delay:.14s}
        .wave-bar.active:nth-child(3){animation-delay:.28s}
        .wave-bar.active:nth-child(4){animation-delay:.42s}
        .wave-bar.active:nth-child(5){animation-delay:.56s}
        .wave-bar.active:nth-child(6){animation-delay:.70s}
        .wave-bar.active:nth-child(7){animation-delay:.84s}
        .wave-bar.green { background: linear-gradient(to top, #00c48c, #00e6a8) !important; }

        .voice-controls {
            padding: 12px 20px 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .voice-connect-btn {
            padding: 14px 24px; border: none; border-radius: var(--r-md);
            background: linear-gradient(135deg, #5b4fff, #9b59f5);
            color: #fff; font-family: 'HarmonyOS Sans', sans-serif;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform .12s, box-shadow .12s, opacity .12s;
        }
        .voice-connect-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px var(--accent-glow); }
        .voice-connect-btn:active { transform: scale(.97); }
        .voice-connect-btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
        .voice-connect-btn .material-icons-round { font-size: 20px !important; }
        .voice-connect-btn.disconnect {
            background: var(--surface2); color: var(--ink);
            box-shadow: none;
        }
        .voice-connect-btn.disconnect:hover { background: var(--danger-light); color: var(--danger); }

        .voice-tap-btn {
            padding: 14px 24px; border: none; border-radius: var(--r-md);
            background: linear-gradient(135deg, #00c48c, #00e6a8);
            color: #fff; font-family: 'HarmonyOS Sans', sans-serif;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0,196,140,.3);
            transition: transform .12s, box-shadow .12s;
        }
        .voice-tap-btn:hover { transform: translateY(-2px); }
        .voice-tap-btn:active { transform: scale(.97); }
        .voice-tap-btn .material-icons-round { font-size: 20px !important; }

        .voice-hint {
            text-align: center; font-size: 12px; color: #aaa;
        }

        .voice-history {
            flex: 1; overflow-y: auto; padding: 0 20px 16px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
        .voice-history-title {
            font-size: 12px; font-weight: 700; color: var(--ink-soft);
            padding: 12px 0 8px; letter-spacing: .3px;
        }
        .voice-history-item {
            padding: 8px 12px; margin-bottom: 6px;
            background: var(--surface); border-radius: 10px;
            font-size: 13px; color: var(--ink);
            cursor: pointer; transition: background .15s;
            line-height: 1.5;
        }
        .voice-history-item:hover { background: var(--surface2); }
        .voice-history-item .q-label { color: var(--accent); font-weight: 700; margin-right: 4px; }

        .result-panel {
            flex: 1; padding: 28px 32px; overflow-y: auto;
            min-width: 0;
        }
        .result-header {
            font-family: 'HarmonyOS Sans', sans-serif;
            font-size: 20px; font-weight: 800;
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 4px;
        }
        .result-header .material-icons-round { font-size: 22px !important; color: var(--accent); }
        .result-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 24px; }

        .result-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px; text-align: center;
        }
        .result-empty-icon {
            width: 80px; height: 80px; border-radius: 24px;
            background: var(--accent-light);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }
        .result-empty-icon .material-icons-round { font-size: 36px !important; color: var(--accent); }
        .result-empty h3 { font-family: 'HarmonyOS Sans', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .result-empty p { font-size: 13px; color: var(--ink-soft); line-height: 1.6; max-width: 300px; }

        .result-loading {
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 20px; gap: 16px;
        }
        .result-loading .spinner {
            width: 40px; height: 40px; border: 3px solid var(--surface2);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        .result-loading p { font-size: 14px; color: var(--ink-soft); }

        .result-cards {
            display: flex; flex-direction: column; gap: 16px;
        }
        .result-card {
            background: var(--white); border-radius: var(--r-lg);
            box-shadow: var(--shadow-sm); overflow: hidden;
            transition: box-shadow .2s, transform .2s;
        }
        .result-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .result-card-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(91,79,255,.04), rgba(155,89,245,.04));
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .result-card-employee {
            display: flex; align-items: center; gap: 10px;
        }
        .result-card-avatar {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--accent); display: flex; align-items: center; justify-content: center;
        }
        .result-card-avatar .material-icons-round { font-size: 18px !important; color: #fff; }
        .result-card-name { font-size: 15px; font-weight: 800; }
        .result-card-dept { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
        .result-card-date {
            font-size: 12px; color: var(--ink-soft); font-weight: 600;
        }
        .result-card-body { padding: 16px 20px; }
        .result-card-field {
            padding: 8px 0; border-bottom: 1px solid var(--border);
        }
        .result-card-field:last-child { border-bottom: none; }
        .result-card-field-key {
            font-size: 11px; font-weight: 700; color: var(--accent);
            text-transform: uppercase; letter-spacing: .5px;
            margin-bottom: 3px;
        }
        .result-card-field-val {
            font-size: 14px; line-height: 1.6; color: var(--ink);
        }

        .result-rag {
            margin-top: 20px; padding: 16px 20px;
            background: linear-gradient(135deg, rgba(91,79,255,.06), rgba(155,89,245,.06));
            border-radius: var(--r-md); border: 1px solid rgba(91,79,255,.1);
        }
        .result-rag-title {
            font-size: 12px; font-weight: 700; color: var(--accent);
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 8px;
        }
        .result-rag-title .material-icons-round { font-size: 14px !important; }
        .result-rag-content {
            font-size: 13px; line-height: 1.7; color: var(--ink);
            white-space: pre-wrap;
        }

        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--ink); color: #fff; padding: 12px 20px;
            border-radius: 14px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,.25); z-index: 9999;
            opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success .material-icons-round { color: var(--success); }
        .toast.error   .material-icons-round { color: var(--danger); }
        .toast .material-icons-round { font-size: 16px !important; }

        @keyframes dotpulse { 0%,100%{opacity:.5;transform:scale(.7)} 50%{opacity:1;transform:scale(1.1)} }
        @keyframes wave { 0%,100%{transform:scaleY(.2);opacity:.4} 50%{transform:scaleY(1);opacity:1} }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

        .hidden { display: none !important; }

        @media (max-width: 860px) {
            .layout { flex-direction: column; }
            .voice-panel {
                width: 100%; position: static; height: auto;
                border-right: none; border-bottom: 1px solid var(--border);
            }
            .voice-history { max-height: 120px; }
            .result-panel { padding: 20px 16px; }
        }
        @media (max-width: 480px) {
            .topbar-badge { display: none; }
            .topbar-main { padding: 0 10px; gap: 6px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-main">
    <a class="topbar-logo" href="#">
        <div class="topbar-logo-icon">
            <span class="material-icons-round">auto_awesome</span>
        </div>
        <span class="topbar-logo-name">OneToMore</span>
    </a>
    <span class="topbar-badge">智能查询</span>
    <span class="topbar-sep"></span>
    <nav style="display:flex;gap:4px;flex-shrink:0">
        <a href="smartadmin.html" style="padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink-soft);text-decoration:none;background:var(--surface);display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='var(--surface)'"><span class="material-icons-round" style="font-size:13px!important">admin_panel_settings</span>管理</a>
        <a href="employee.html" style="padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink-soft);text-decoration:none;background:var(--surface);display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='var(--surface)'"><span class="material-icons-round" style="font-size:13px!important">assignment</span>汇报</a>
    </nav>
    </div>
    <div class="topbar-statusbar">
        <span class="topbar-dot" id="topbar-dot"></span>
        <span id="topbar-status-text">未连接</span>
    </div>
</header>

<div class="layout">
    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- 左侧：豆包语音区                                               -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <div class="voice-panel">
        <div class="voice-header">
            <div class="voice-title">
                <span class="material-icons-round">smart_toy</span>语音助理
            </div>
            <div class="voice-sub">连接后直接说话，助理会实时回应</div>
        </div>

        <div class="voice-status">
            <span class="voice-status-dot" id="vs-dot"></span>
            <span class="voice-status-text" id="vs-text">未连接</span>
        </div>

        <div class="voice-subtitle" id="vs-subtitle">
            <span class="placeholder">等待连接…</span>
        </div>

        <div class="voice-wave" id="vs-wave">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <div class="voice-controls">
            <button class="voice-connect-btn" id="connect-btn" onclick="DW.toggleConnect()">
                <span class="material-icons-round">power_settings_new</span>
                <span id="connect-btn-text">连接助理</span>
            </button>
            <button class="voice-tap-btn hidden" id="tap-btn" onclick="DW.startMic()">
                <span class="material-icons-round">mic</span>点击开始说话
            </button>
            <div class="voice-hint">连接后可直接说话，或点击按钮开始</div>
        </div>

        <div class="voice-history">
            <div class="voice-history-title">提问记录</div>
            <div id="voice-history-list">
                <div style="color:var(--ink-soft);font-size:12px;padding:4px 0">暂无记录</div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- 右侧：检索结果展示区                                            -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <div class="result-panel">
        <div class="result-header">
            <span class="material-icons-round">manage_search</span>查询结果
        </div>
        <div class="result-sub">语音提问后，相关汇报记录将显示在这里</div>

        <div id="result-empty" class="result-empty">
            <div class="result-empty-icon">
                <span class="material-icons-round">record_voice_over</span>
            </div>
            <h3>请向助理提问</h3>
            <p>点击左侧「连接助理」，然后直接说话提问，例如"今天张三汇报了什么"</p>
        </div>

        <div id="result-loading" class="result-loading hidden">
            <div class="spinner"></div>
            <p>正在检索相关记录…</p>
        </div>

        <div id="result-content" class="hidden">
            <div class="result-cards" id="result-cards"></div>
            <div class="result-rag hidden" id="result-rag">
                <div class="result-rag-title">
                    <span class="material-icons-round">auto_awesome</span>AI 摘要
                </div>
                <div class="result-rag-content" id="result-rag-content"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <span class="material-icons-round" id="toast-icon">check_circle</span>
    <span id="toast-msg"></span>
</div>

<script>
    const SUPABASE_URL      = 'https://cgtrlucacjrbtazidixn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndHJsdWNhY2pyYnRhemlkaXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDI1NDcsImV4cCI6MjA5NDExODU0N30.PX_IncuHZfsLl23OHt00XXyswycFtkmcUI3Su7BWkWY';
    const DOUBAO_WS_URL     = 'wss://doubao-ws-proxy.onrender.com/proxy';

    let sbClient = null;
    let toastTimer = null;
    let formFieldsCache = [];
    let queryHistory = [];

    window.addEventListener('DOMContentLoaded', () => {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        loadFormFields();
    });

    function esc(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    function showToast(msg, type = 'success') {
        const toast  = document.getElementById('toast');
        const msgEl  = document.getElementById('toast-msg');
        const iconEl = document.getElementById('toast-icon');
        toast.className = 'toast ' + type;
        msgEl.textContent = msg;
        iconEl.textContent = type === 'error' ? 'error' : 'check_circle';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function loadFormFields() {
        try {
            const { data, error } = await sbClient
                .from('form_fields')
                .select('*')
                .order('sort_order', { ascending: true });
            if (!error && data) formFieldsCache = data;
        } catch(_) {}
    }

    async function loadDoubaoConfig() {
        try {
            const { data, error } = await sbClient
                .from('model_configs')
                .select('*')
                .limit(1)
                .single();
            if (!error && data) return data;
        } catch(_) {}
        return null;
    }

    /* ══════════════════════════════════════════════════════════════ */
    /*  UI 状态控制                                                   */
    /* ══════════════════════════════════════════════════════════════ */
    function setTopbarStatus(text, online) {
        document.getElementById('topbar-status-text').textContent = text;
        const dot = document.getElementById('topbar-dot');
        dot.className = 'topbar-dot' + (online ? ' online' : '');
    }

    function setVoiceStatus(text, state) {
        document.getElementById('vs-text').textContent = text;
        const dot = document.getElementById('vs-dot');
        dot.className = 'voice-status-dot';
        if (state === 'connected') dot.classList.add('connected');
        else if (state === 'listening') dot.classList.add('listening');
        else if (state === 'speaking') dot.classList.add('speaking');
    }

    function setSubtitle(text, listening) {
        const el = document.getElementById('vs-subtitle');
        if (text) {
            el.textContent = text;
        } else {
            el.innerHTML = '<span class="placeholder">等待对话开始…</span>';
        }
        el.classList.toggle('listening', !!listening);
    }

    function setWave(active, green) {
        document.querySelectorAll('.wave-bar').forEach(b => {
            b.classList.toggle('active', active);
            b.classList.toggle('green', !!green);
        });
    }

    function showResultEmpty() {
        document.getElementById('result-empty').classList.remove('hidden');
        document.getElementById('result-loading').classList.add('hidden');
        document.getElementById('result-content').classList.add('hidden');
    }

    function showResultLoading() {
        document.getElementById('result-empty').classList.add('hidden');
        document.getElementById('result-loading').classList.remove('hidden');
        document.getElementById('result-content').classList.add('hidden');
    }

    function showResultContent(records, ragContent) {
        document.getElementById('result-empty').classList.add('hidden');
        document.getElementById('result-loading').classList.add('hidden');
        document.getElementById('result-content').classList.remove('hidden');

        const cardsEl = document.getElementById('result-cards');
        const ragEl = document.getElementById('result-rag');
        const ragContentEl = document.getElementById('result-rag-content');

        if (records && records.length > 0) {
            cardsEl.innerHTML = records.map(r => renderCard(r)).join('');
        } else {
            cardsEl.innerHTML = '<div style="color:var(--ink-soft);font-size:14px;padding:20px 0;text-align:center">未找到相关记录</div>';
        }

        if (ragContent) {
            ragContentEl.textContent = ragContent;
            ragEl.classList.remove('hidden');
        } else {
            ragEl.classList.add('hidden');
        }
    }

    function renderCard(record) {
        let formatted = record.formatted_fields || record.formatted_text;
        if (typeof formatted === 'string') {
            try { formatted = JSON.parse(formatted); } catch(_) { formatted = null; }
        }

        const empName = record.employee_name || '未知员工';
        const empDept = record.department || '';
        const dateStr = record.record_date || (record.created_at ? new Date(record.created_at).toLocaleDateString('zh-CN') : '-');

        let fieldsHtml = '';
        if (formatted && typeof formatted === 'object') {
            const fieldMap = {};
            formFieldsCache.forEach(f => { fieldMap[f.name] = f.label; });
            for (const [key, val] of Object.entries(formatted)) {
                if (val) {
                    fieldsHtml += `<div class="result-card-field">
                        <div class="result-card-field-key">${esc(fieldMap[key] || key)}</div>
                        <div class="result-card-field-val">${esc(typeof val === 'string' ? val : JSON.stringify(val))}</div>
                    </div>`;
                }
            }
        }

        return `<div class="result-card">
            <div class="result-card-header">
                <div class="result-card-employee">
                    <div class="result-card-avatar">
                        <span class="material-icons-round">person</span>
                    </div>
                    <div>
                        <div class="result-card-name">${esc(empName)}</div>
                        ${empDept ? `<div class="result-card-dept">${esc(empDept)}</div>` : ''}
                    </div>
                </div>
                <div class="result-card-date">${esc(dateStr)}</div>
            </div>
            <div class="result-card-body">${fieldsHtml || '<div style="color:var(--ink-soft);font-size:13px">无详细内容</div>'}</div>
        </div>`;
    }

    function addToHistory(question) {
        queryHistory.unshift(question);
        if (queryHistory.length > 10) queryHistory.pop();

        const listEl = document.getElementById('voice-history-list');
        listEl.innerHTML = queryHistory.map(q =>
            `<div class="voice-history-item" onclick="reQuery('${esc(q).replace(/'/g, "\\'")}')">
                <span class="q-label">Q:</span>${esc(q)}
            </div>`
        ).join('');
    }

    async function reQuery(question) {
        setSubtitle(question, false);
        await doQuery(question);
    }

    /* ══════════════════════════════════════════════════════════════ */
    /*  查询 query-handler                                            */
    /* ══════════════════════════════════════════════════════════════ */
    async function doQuery(question) {
        showResultLoading();
        addToHistory(question);

        try {
            const res = await fetch(SUPABASE_URL + '/functions/v1/query-handler', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
                body: JSON.stringify({ question })
            });

            const data = await res.json();

            if (data.error) throw new Error(data.error);

            const records = data.records || [];
            const ragContent = data.rag_content || '';

            showResultContent(records, ragContent);

            if (ragContent && DW.isConnected()) {
                DW.sendRAGText(ragContent);
            }

            try {
                await sbClient.from('conversations').insert({
                    question: question,
                    rag_content: ragContent,
                    matched_count: records.length
                });
            } catch(_) {}
        } catch(e) {
            showToast('查询失败: ' + e.message, 'error');
            showResultEmpty();
        }
    }

    /* ══════════════════════════════════════════════════════════════ */
    /*  豆包语音助理核心逻辑                                           */
    /* ══════════════════════════════════════════════════════════════ */
    let asrDebounce = null;
    let lastAsrText = '';
    let queryFired = false;
    let pendingQuery = '';

    const DW = (() => {
        let ws, sid, seq = 2, state = 'idle';
        let micStream, audioCtx, srcNode, processor;
        let chunks = [], queue = [], playing = false;
        let systemPrompt = '你是OneToMore系统的智能查询助理。老板会通过语音询问员工汇报情况，请根据提供的资料简短口语化地回答，每次不超过5句话。';
        let speaker = 'zh_female_vv_jupiter_bigtts';

        const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random() * 16 | 0;
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });

        const encode = (eid, payload, sessionId) => {
            const hdr = new Uint8Array([0x11, 0x14, 0x10, 0x00]);
            const parts = [];
            const eb = new ArrayBuffer(4); new DataView(eb).setUint32(0, eid, false); parts.push(new Uint8Array(eb));
            if (sessionId) {
                const sb = new TextEncoder().encode(sessionId);
                const sl = new ArrayBuffer(4); new DataView(sl).setUint32(0, sb.byteLength, false);
                parts.push(new Uint8Array(sl)); parts.push(sb);
            }
            const pb = typeof payload === 'string' ? new TextEncoder().encode(payload) : new Uint8Array(payload);
            const pl = new ArrayBuffer(4); new DataView(pl).setUint32(0, pb.byteLength, false);
            parts.push(new Uint8Array(pl)); parts.push(pb);
            const tot = parts.reduce((s, p) => s + p.byteLength, hdr.byteLength);
            const out = new Uint8Array(tot); let o = 0;
            out.set(hdr, o); o += hdr.byteLength;
            parts.forEach(p => { out.set(p, o); o += p.byteLength; });
            return out.buffer;
        };

        const encodeAudio = pcm => {
            const hdr = new Uint8Array([0x11, 0x25, 0x00, 0x00]);
            seq++;
            const sq = new ArrayBuffer(4); new DataView(sq).setInt32(0, seq, false);
            const ev = new ArrayBuffer(4); new DataView(ev).setUint32(0, 200, false);
            const sb = sid ? new TextEncoder().encode(sid) : new Uint8Array(0);
            const sl = new ArrayBuffer(4); new DataView(sl).setUint32(0, sb.byteLength, false);
            const pb = new Uint8Array(pcm);
            const pl = new ArrayBuffer(4); new DataView(pl).setUint32(0, pb.byteLength, false);
            const tot = 4 + 4 + 4 + 4 + sb.byteLength + 4 + pb.byteLength;
            const out = new Uint8Array(tot); let o = 0;
            [hdr, new Uint8Array(sq), new Uint8Array(ev), new Uint8Array(sl), sb, new Uint8Array(pl), pb]
                .forEach(p => { out.set(p, o); o += p.byteLength; });
            return out.buffer;
        };

        const parseFrame = buf => {
            const dv = new DataView(buf);
            const hSz = (dv.getUint8(0) & 0x0f) * 4, msgType = (dv.getUint8(1) >> 4) & 0x0f, flags = dv.getUint8(1) & 0x0f;
            let o = hSz;
            if (msgType === 15) o += 4;
            if (flags & 0x03) o += 4;
            let eid = 0; if (flags & 0x04) { eid = dv.getUint32(o, false); o += 4; }
            let sessId = null;
            if (o + 4 <= buf.byteLength) { const sl = dv.getUint32(o, false); if (sl > 0 && sl < 200 && o + 4 + sl <= buf.byteLength) { o += 4; sessId = new TextDecoder().decode(new Uint8Array(buf, o, sl)); o += sl; } }
            let payload = null;
            if (o + 4 <= buf.byteLength) { const pl = dv.getUint32(o, false); o += 4; if (pl > 0 && o + pl <= buf.byteLength) payload = buf.slice(o, o + pl); }
            return { msgType, eid, payload };
        };

        const flushAudio = () => {
            if (!chunks.length) return;
            const tot = chunks.reduce((s, c) => s + c.byteLength, 0), merged = new Uint8Array(tot); let o = 0;
            chunks.forEach(c => { merged.set(new Uint8Array(c), o); o += c.byteLength; }); chunks = [];
            queue.push(URL.createObjectURL(new Blob([merged], { type: 'audio/ogg; codecs=opus' })));
            playNext();
        };
        const playNext = () => {
            if (playing || !queue.length) return; playing = true;
            const url = queue.shift(), a = new Audio(url);
            const done = () => { URL.revokeObjectURL(url); playing = false; playNext(); };
            a.onended = done; a.onerror = done; a.play().catch(done);
        };
        const stopAudio = () => { queue = []; chunks = []; playing = false; };

        const sanitize = s => s.replace(/[\r\n\t]/g, ' ').replace(/\\/g, '、').replace(/["]/g, '').replace(/\s{2,}/g, ' ').trim().substring(0, 500);

        const onMsg = evt => {
            if (!(evt.data instanceof ArrayBuffer)) return;
            const { msgType, eid, payload } = parseFrame(evt.data);
            if (msgType === 9 && payload) {
                let j = {}; try { j = JSON.parse(new TextDecoder().decode(payload)); } catch (_) {}
                if (eid === 50) {
                    setVoiceStatus('连接成功，初始化中…', 'connected');
                    setTopbarStatus('初始化中', true);
                    ws.send(encode(100, JSON.stringify({
                        tts: { speaker, audio_config: { channel: 1, format: 'ogg_opus', sample_rate: 24000 }, extra: {} },
                        asr: { audio_info: { format: 'pcm', sample_rate: 16000, channel: 1 } },
                        dialog: {
                            bot_name: '助理',
                            system_role: sanitize(systemPrompt),
                            speaking_style: '口语化、简短，每次不超过5句话',
                            extra: { model: '1.2.1.1', input_mod: 'keep_alive', strict_audit: false }
                        }
                    }), sid));
                } else if (eid === 150) {
                    state = 'listening';
                    setVoiceStatus('已就绪，请说话', 'listening');
                    setTopbarStatus('已就绪', true);
                    document.getElementById('tap-btn').classList.remove('hidden');
                    setWave(false, false);
                } else if (eid === 350) {
                    const t = j.text || '';
                    if (t) setSubtitle(t, false);
                    state = 'speaking';
                    setVoiceStatus('助理正在回答…', 'speaking');
                    setTopbarStatus('回答中', true);
                    setWave(true, false);
                } else if (eid === 351) {
                    flushAudio();
                } else if (eid === 359) {
                    flushAudio();
                    state = 'listening';
                    setVoiceStatus('正在聆听…', 'listening');
                    setTopbarStatus('聆听中', true);
                    setWave(true, true);
                    setSubtitle('', true);
                } else if (eid === 450) {
                    stopAudio();
                } else if (eid === 451) {
                    const t = (j.results || []).map(r => r.text).join('');
                    if (t) {
                        setSubtitle(t, true);
                        setVoiceStatus('我听到：' + t.substring(0, 30), 'listening');
                        pendingQuery = t;
                    }
                } else if (eid === 153 || eid === 599) {
                    setVoiceStatus('连接出错，请重试', '');
                    setTopbarStatus('出错', false);
                }
            }
            if (msgType === 11 && payload) chunks.push(payload);
        };

        const startMic = async () => {
            document.getElementById('tap-btn').classList.add('hidden');
            setVoiceStatus('正在聆听…', 'listening');
            setWave(true, true);
            setSubtitle('', true);
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                srcNode = audioCtx.createMediaStreamSource(micStream);
                processor = audioCtx.createScriptProcessor(512, 1, 1);
                processor.onaudioprocess = e => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    const f32 = e.inputBuffer.getChannelData(0), i16 = new Int16Array(f32.length);
                    f32.forEach((v, i) => { i16[i] = Math.max(-32768, Math.min(32767, v * 32767)); });
                    ws.send(encodeAudio(i16.buffer));
                };
                srcNode.connect(processor); processor.connect(audioCtx.destination);
            } catch (e) {
                setVoiceStatus('麦克风错误: ' + (e.name || e.message), '');
                showToast('请允许麦克风权限', 'error');
            }
        };

        const stopMic = () => {
            try { processor?.disconnect(); } catch (_) { }
            try { srcNode?.disconnect(); } catch (_) { }
            try { audioCtx?.close(); } catch (_) { }
            micStream?.getTracks().forEach(t => t.stop()); micStream = srcNode = processor = audioCtx = null;
        };

        const toggleConnect = async () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                await connect();
            }
        };

        const connect = async () => {
            const btn = document.getElementById('connect-btn');
            const btnText = document.getElementById('connect-btn-text');
            btn.disabled = true;
            btnText.textContent = '连接中…';

            const config = await loadDoubaoConfig();
            if (config) {
                if (config.system_prompt) systemPrompt = config.system_prompt;
                if (config.speaker) speaker = config.speaker;
            }

            const promptRow = await sbClient.from('prompts').select('content').eq('scene', 'query').limit(1).single();
            if (promptRow.data && promptRow.data.content) {
                systemPrompt = promptRow.data.content;
            }

            setVoiceStatus('正在连接…', '');
            setTopbarStatus('连接中', false);
            setSubtitle('', false);

            sid = uuid(); seq = 2; chunks = [];

            const u = new URL(DOUBAO_WS_URL);
            u.searchParams.set('session_id', 'otm_' + Date.now());
            ws = new WebSocket(u.toString()); ws.binaryType = 'arraybuffer';
            ws.onopen = () => {
                ws.send(encode(1, '{}', null));
                btn.disabled = false;
                btnText.textContent = '断开连接';
                btn.classList.add('disconnect');
            };
            ws.onmessage = onMsg;
            ws.onerror = () => {
                setVoiceStatus('连接失败', '');
                setTopbarStatus('连接失败', false);
                btn.disabled = false;
                btnText.textContent = '连接助理';
                btn.classList.remove('disconnect');
                showToast('连接失败，请检查网络', 'error');
            };
            ws.onclose = e => {
                stopMic();
                state = 'idle';
                setWave(false, false);
                setVoiceStatus('已断开', '');
                setTopbarStatus('未连接', false);
                btn.disabled = false;
                btnText.textContent = '连接助理';
                btn.classList.remove('disconnect');
                document.getElementById('tap-btn').classList.add('hidden');

                if (pendingQuery && !queryFired) {
                    queryFired = true;
                    doQuery(pendingQuery);
                    pendingQuery = '';
                }
            };
        };

        const disconnect = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(encode(102, '{}', sid));
                    setTimeout(() => {
                        try { ws.send(encode(2, '{}', null)); setTimeout(() => ws?.close(), 300); } catch (_) { }
                    }, 300);
                } catch (_) { }
            }
            stopMic(); stopAudio(); ws = null; state = 'idle';
            setWave(false, false);
            setVoiceStatus('已断开', '');
            setTopbarStatus('未连接', false);
            document.getElementById('connect-btn').classList.remove('disconnect');
            document.getElementById('connect-btn-text').textContent = '连接助理';
            document.getElementById('tap-btn').classList.add('hidden');
        };

        const sendRAGText = ragText => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const chatMsg = JSON.stringify({
                event: 'ChatRAGText',
                text: sanitize(ragText.substring(0, 4000))
            });
            ws.send(encode(200, chatMsg, sid));
        };

        const isConnected = () => ws && ws.readyState === WebSocket.OPEN;

        return { toggleConnect, connect, disconnect, startMic, sendRAGText, isConnected };
    })();

    /* ══════════════════════════════════════════════════════════════ */
    /*  ASR 结束时自动触发查询                                         */
    /* ══════════════════════════════════════════════════════════════ */
    const origSetSubtitle = setSubtitle;
    setSubtitle = function(text, listening) {
        origSetSubtitle(text, listening);

        if (listening && text && text !== lastAsrText) {
            lastAsrText = text;
            queryFired = false;
            if (asrDebounce) clearTimeout(asrDebounce);
            asrDebounce = setTimeout(() => {
                if (lastAsrText && lastAsrText.length >= 2 && !queryFired) {
                    queryFired = true;
                    doQuery(lastAsrText);
                    lastAsrText = '';
                    pendingQuery = '';
                }
            }, 2500);
        }
    };
</script>
</body>
</html>
